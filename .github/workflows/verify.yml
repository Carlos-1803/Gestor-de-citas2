name: Verify web and MariaDB API
on:
  push:
    branches: [master, 'codex/**']
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: test-root-only
          MARIADB_DATABASE: gestor_test
          MARIADB_USER: gestor
          MARIADB_PASSWORD: test-only-password
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      ConnectionStrings__Database: 'Server=127.0.0.1;Port=3306;Database=gestor_test;User=gestor;Password=test-only-password'
      ASPNETCORE_ENVIRONMENT: Development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: FrondEnd/package-lock.json
      - run: npm --prefix FrondEnd ci
      - run: npm --prefix FrondEnd run lint
      - run: npm --prefix FrondEnd test
      - run: npm --prefix FrondEnd run build
      - run: dotnet build BackEnd --configuration Release
      - run: dotnet run --project BackEnd --configuration Release --no-build -- --migrate
      - name: Install integration client
        run: |
          sudo apt-get update
          sudo apt-get install -y mariadb-client
          cat > /tmp/reviews-db.cnf <<'EOF'
          [client]
          host=127.0.0.1
          port=3306
          user=gestor
          password=test-only-password
          # Solo para el contenedor MariaDB desechable de CI, sin TLS.
          skip-ssl
          EOF
          chmod 600 /tmp/reviews-db.cnf
      - name: Integration checks
        shell: bash
        run: |
          set -euo pipefail
          dotnet run --project BackEnd --configuration Release --no-build --no-launch-profile --urls http://127.0.0.1:5191 > /tmp/api.log 2>&1 &
          API_PID=$!
          trap 'kill "$API_PID" 2>/dev/null || true' EXIT
          READY=0
          for attempt in $(seq 1 40); do
            if ! kill -0 "$API_PID" 2>/dev/null; then
              cat /tmp/api.log
              exit 1
            fi
            if curl -fsS http://127.0.0.1:5191/api/health; then READY=1; break; fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then cat /tmp/api.log; exit 1; fi
          mariadb --defaults-extra-file=/tmp/reviews-db.cnf --database=gestor_test --batch -e 'SELECT VERSION(); SELECT COUNT(*) AS applied_migrations FROM __EFMigrationsHistory;'
          python3 -u tests/integration.py --url http://127.0.0.1:5191 2>&1 | tee /tmp/integration.log
          python3 -u tests/integration_reviews.py --url http://127.0.0.1:5191 --db-config /tmp/reviews-db.cnf --database gestor_test 2>&1 | tee /tmp/integration-reviews.log
      - name: Preserve integration diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-diagnostics
          if-no-files-found: ignore
          retention-days: 7
          path: |
            /tmp/api.log
            /tmp/integration.log
            /tmp/integration-reviews.log
